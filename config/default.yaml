# 개인정보 영역 탐지 파이프라인 설정
#
# 파이프라인은 두 단계다. 섹션 이름이 단계 이름과 1:1 로 대응한다.
#
#   ① 전처리    pipeline
#   ② VLM 탐지  detect + llm    이미지를 보고 개인정보를 전사한다 (좌표는 대략)
#   ③ 크롭 OCR  locate + ocr    지목된 영역을 잘라 인식한다 (정밀 좌표)
#   ④ 검증      verify          체크섬·자리수·항목명 필터
#
# 적용 순서 (뒤가 앞을 덮는다):
#   코드 기본값 → 이 파일 → 환경변수(PII_*) → CLI 플래그
#
# 탐색 순서: --config 인자 > $PII_CONFIG > ./config.yaml > ./config/default.yaml
# 오타난 키는 조용히 무시되지 않고 실행이 즉시 실패한다.

# ---------------------------------------------------------------------------
# LLM (vLLM OpenAI 호환 서버)
# ---------------------------------------------------------------------------
llm:
  # 모델 이름. vLLM 기동 시 지정한 것과 정확히 일치해야 한다.
  model: Qwen/Qwen3.5-9B
  base_url: http://127.0.0.1:8000/v1
  # vLLM 은 키를 검증하지 않으므로 더미 값이어도 된다.
  api_key: EMPTY

  # 0 고정 권장. 학습데이터 구축과 감사 대응에는 결정론적 출력이 필요하다.
  temperature: 0.0

  # 출력 상한. 한 항목이 text/field/bbox_norm 까지 50~70토큰이다.
  # 잘리면 그 타일의 탐지가 전량 날아간다 (JSON 이 불완전해짐).
  max_tokens: 2048
  # 잘렸을 때 재시도에 쓸 상한. temperature=0 이라 같은 상한으로 재시도하면
  # 매번 같은 지점에서 똑같이 잘린다. 상한을 올려야만 벗어난다.
  max_tokens_on_truncation: 4096
  timeout: 60.0

  guided_backend: xgrammar
  # Qwen3 계열 추론 모드. 켜면 사고 토큰을 수천 개 뱉어 지연시간 예산을 날린다.
  # false 유지.
  enable_thinking: false

  # VLM 으로 보낼 이미지의 긴 변 길이.
  #
  # !! detect.tiles 와 함께 봐야 하는 값이다 !!
  # A4 를 target_long_side=2480 으로 전처리하면 1748x2480 이다. 타일링 없이
  # 그대로 보내면 여기서 0.73배로 줄어들고 주민등록번호 숫자가 10px 대로
  # 떨어져 읽을 수 없게 된다.
  # tiles=3 이면 타일 하나가 1748x약985 라서 긴 변이 1748 이고 축소가 아예
  # 일어나지 않는다. --print-config 가 이 조합을 검산해 알려준다.
  image_max_side: 2000

  # 스키마 위반 / 네트워크 오류 재시도 횟수
  max_retries: 2

# ---------------------------------------------------------------------------
# ② VLM 탐지
# ---------------------------------------------------------------------------
detect:
  # 페이지를 몇 조각으로 나눠 호출할지.
  #
  # 1 로 두면 한 번의 호출로 페이지 전체를 전사하게 되는데, 뒤쪽 항목이
  # 잘린다 — 모델이 분류를 못해서가 아니라 긴 구조화 출력의 후반부가
  # 무너지기 때문이다. 가족관계증명서 한 장이 구성원 9명 x 4필드 = 36건인데
  # 9B 모델이 36건을 한 번에 온전히 뱉기를 기대하는 것은 무리다.
  # 조각당 10건 내외가 되도록 잡아라. 밀집한 표 문서는 3~4.
  tiles: 3

  # 조각 간 겹침 비율 (조각 두께 기준).
  # 겹침이 없으면 경계에 걸친 한 줄이 양쪽에서 반씩 잘려 둘 다 못 읽는다.
  overlap: 0.08

  # 겹침 구간의 중복 제거. 값이 같아도 위치가 겹치지 않으면 남긴다
  # (같은 이름이 문서 여러 곳에 나오는 것은 정상이고 각각 마스킹해야 한다).
  dedup: true

  # 문서 종류 힌트. 비워 두는 것이 기본이다 — 채우면 prefix caching 이 깨지고,
  # 잘못 알려주면 모델이 없는 칸을 찾는다.
  hint: ""

  # 타일당 호출 횟수. 학습 없이 미탐을 줄이는 유일한 손잡이다.
  #
  # 2 이상이면 같은 타일을 여러 번 뽑고 dedup 이 합집합을 만든다. 한 번은
  # 놓치고 다른 번엔 잡히는 항목이 회수되므로 재현율이 오르고 정밀도가 떨어진다.
  # 마스킹에서는 미탐(개인정보 노출)이 과탐(멀쩡한 칸 덧칠)보다 훨씬 비싸므로
  # 대체로 맞는 거래지만, 호출 수가 tiles x samples 로 늘어난다.
  # 실측으로 정할 것 — scripts/measure.py 가 1 vs 3 을 비교해준다.
  samples: 1

  # samples >= 2 일 때 쓸 온도. 0 이면 같은 답이 와서 샘플을 늘린 의미가 없다.
  # samples == 1 이면 무시되고 llm.temperature(0)가 쓰인다 (결정론 유지).
  sample_temperature: 0.3

  # 동시 호출 수. 0 이면 호출 수만큼 (상한 8).
  # 타일 호출은 서로 독립이라 직렬로 돌릴 이유가 없다.
  workers: 0

  # 비전 인코더의 패치 크기 x merge 크기. **모델을 바꾸면 반드시 같이 바꿀 것.**
  #   Qwen3-VL     16 x 2 = 32
  #   Qwen2/2.5-VL 14 x 2 = 28
  # 이미지는 이 값의 배수로 리사이즈되어 인코더에 들어간다. 이 값이 틀리면
  # 모델이 본 크기를 잘못 계산하고, 모델이 절대 픽셀 좌표를 냈을 때
  # 위치에 비례해 커지는 밀림이 생긴다.
  #
  # 좌표 규약도 버전마다 다르다 (프롬프트는 Qwen3-VL 기준 0~1000 을 요구한다):
  #   Qwen2-VL      0~1000 상대좌표
  #   Qwen2.5-VL    리사이즈된 이미지의 절대 픽셀
  #   Qwen3-VL      0~1000 상대좌표
  # 다르게 오면 detect 가 감지해 환산하고 경고를 남긴다 (meta.coord_convention).
  image_factor: 32

  # 타일 하나의 픽셀 상한. 0 이면 모델 기본값 (16384 x image_factor^2).
  # **서버(vLLM)의 설정과 맞춰야 의미가 있다** — 서버가 더 작은 값을 쓰면
  # 타일이 더 축소되고 작은 한글이 뭉개진다. 그건 곧 미탐이다.
  # 이 값을 넘어 축소되는 타일이 있으면 경고가 나온다.
  max_pixels: 0

  # 좌표 규약 고정. auto / unit / per-mille / pixel.
  #
  # auto 는 응답의 최댓값으로 판정하는데 **원리적 사각지대가 있다** — 타일이
  # 1000px 보다 크고 모델이 절대 픽셀로 답했는데 그 값들이 우연히 모두 1000
  # 미만이면 (페이지 위쪽에만 항목이 있는 경우) per-mille 로 오판한다.
  # 그 오차는 위치에 비례해 커지는 밀림이라 눈으로는 구분되지 않는다.
  #
  # scripts/diagnose.py 로 한 번 확인한 뒤 고정하는 것을 권한다.
  coord_convention: auto

# ---------------------------------------------------------------------------
# ③ 좌표 확정 (크롭 OCR)
# ---------------------------------------------------------------------------
locate:
  # 크롭 여유 (VLM bbox 크기 대비 비율)와 그 최솟값(px).
  # VLM 좌표는 어긋나므로 넉넉히 잡는다. 좁으면 값이 크롭 밖으로 나가
  # 못 찾고 vlm_coarse 로 떨어진다. 비율과 절대값 중 큰 쪽이 적용된다.
  #
  # min_pad_px 는 **모델의 grounding 해상도 하한보다 커야 한다.** Qwen-VL 의
  # 공간 단위는 비전 토큰 1개 = image_factor x image_factor 픽셀 (Qwen3-VL 32).
  # 0~1000 좌표의 눈금이 1.76px 여도 모델이 구분하는 최소 단위는 32px 이고,
  # 300dpi 한글 한 줄이 30~40px 이므로 모델은 한 줄보다 정확할 수 없다.
  # 12 였을 때 한 줄짜리 이름 칸에서 세로 여유가 12px 밖에 안 나와 값이 크롭
  # 밖으로 새어나갔다. 하한의 1.5배를 준다. image_factor 를 바꾸면 같이 볼 것.
  pad_ratio: 0.35
  min_pad_px: 48

  # 크롭을 OCR 에 넣기 전 확대 배율.
  # 작은 글씨에 대한 유일한 대응책이다. 원본에 없는 정보를 만들지는 못하지만
  # rec 모델은 입력 글자 높이에 민감하므로 실측으로 효과가 있다. 1.0 이면 끈다.
  upscale: 2.0
  # 업샘플 후 크롭 긴 변 상한 (px). 넘으면 배율을 자동으로 줄인다.
  max_crop_side: 1600

  # 1차에서 값을 못 찾았을 때 크롭을 다시 뜰 여유 비율 (VLM bbox 가 크게
  # 어긋난 경우). 재시도는 한 번만 한다 — 두 번 넓혀서 안 잡히면 크롭 문제가 아니다.
  retry_pad_ratio: 1.2

  # 한 값을 이룰 수 있는 최대 박스 수 ("010-1234" + "5678").
  # 기하 선택에서는 과선택 상한 역할이다 — 넉넉한 bbox 가 옆 칸까지 덮었을 때
  # 무한정 딸려오지 않게 막는다.
  max_join: 4

  # 텍스트 매칭이 실패했을 때 기하(위치 겹침)로 박스를 고를지.
  #
  # 이게 왜 필요한가: VLM 이 잘하는 일은 "여기에 이 종류의 개인정보가 있다" 는
  # 판단이다. 반면 901112-2846261 을 13자리 모두 정확히 맞히는 것은 중복성이
  # 0인 과제이고 9B 급 모델에서 신뢰할 수 없다 (숫자에는 오독을 교정해줄
  # 언어모델 prior 가 없다). 텍스트 일치를 필수 조건으로 두면 잘하는 일의
  # 결과를 못하는 일이 가로막는다 — 위치를 정확히 지목했는데 숫자 한 자리를
  # 틀려서 좌표가 버려진다.
  # 그래서 텍스트 일치는 "확인 증거" 로 강등하고 좌표 확정은 기하가 맡는다.
  # false 로 두면 이전 동작(텍스트 불일치 = 좌표 포기)으로 돌아간다. A/B 비교용.
  geometry_fallback: true

  # 박스 중심이 VLM bbox 밖일 때, 면적의 이 비율 이상이 안에 들어와야 후보로 본다.
  # 긴 주소 줄이 VLM bbox 를 관통해 중심이 밖으로 나간 경우를 받는 2차 그물.
  min_cover: 0.5

# ---------------------------------------------------------------------------
# ④ 검증
# ---------------------------------------------------------------------------
# 여기서는 탐지하지 않는다. VLM 이 판단한 것을 검사만 한다.
# 검증기는 최악의 경우 "모르겠다" 를 낼 뿐, 틀린 답을 만들어내지 않는다.
verify:
  # 체크섬으로 종류가 증명된 경우 type 을 고칠지.
  # 13자리 + 주민등록번호 체크섬 통과인데 다른 종류라고 했다면 그건 주민등록번호다.
  # 끄면 교정 대신 needs_review 만 세운다.
  retype_on_checksum: true

  # 항목명만 있는 영역("성명" 같은 인쇄된 헤더)은 항상 버린다 — 스위치가 없다.
  # 조건이 좁아서 값을 잃지 않기 때문이다: VLM 과 OCR 이 **둘 다** 항목명을
  # 읽었을 때만 버린다. 한쪽이라도 값을 읽었다면 남기고 needs_review 로 넘긴다
  # (헤더를 덧칠하는 손해 < 이름을 놓치는 손해).

  # 같은 라벨끼리 이 비율 이상 겹치면 중복으로 본다.
  dedup_iou: 0.6

# ---------------------------------------------------------------------------
# OCR (PaddleOCR) — 페이지 전체가 아니라 크롭에만 돈다
# ---------------------------------------------------------------------------
ocr:
  lang: korean

  # 폐쇄망에서는 필수. PaddleOCR 은 기본적으로 첫 실행 시 모델을 자동
  # 다운로드하는데 폐쇄망에서는 여기서 실패한다.
  #   python scripts/download_models.py --out ./ocr_models
  # 로 미리 반입하고 아래 경로를 채울 것. 환경변수로도 지정 가능:
  #   PII_OCR_DET_DIR / PII_OCR_REC_DIR / PII_OCR_CLS_DIR
  det_model_dir: null
  rec_model_dir: null
  cls_model_dir: null

  # 검출 임계값. 낮게 유지해야 손글씨·도장에 겹친 글자가 살아남는다.
  det_db_thresh: 0.20
  det_db_box_thresh: 0.30
  det_db_unclip_ratio: 1.8

  # rec 신뢰도 구간: >= ok 는 OK, < floor 는 FAILED(내용 신뢰 불가), 사이는 LOW_CONF
  rec_conf_ok: 0.80
  rec_conf_floor: 0.35

  use_gpu: true
  # 사용할 GPU 번호 (nvidia-smi 인덱스). vLLM 이 0 번을 점유하고 있다면
  # 여기를 1 로 바꿔 다른 카드로 보내면 메모리 경합이 사라진다.
  # CUDA_VISIBLE_DEVICES 를 함께 쓰면 그 목록 안에서의 상대 번호로 해석된다.
  gpu_id: 0
  # 같은 GPU 를 공유할 때의 상한 (MB).
  # vLLM 의 --gpu-memory-utilization 과 합이 100% 를 넘지 않게 맞출 것.
  gpu_mem: 4000
  # 검출 입력 최대 변 길이. 크롭은 이보다 작으므로 사실상 무제한이지만,
  # locate.max_crop_side 보다는 크게 두어야 업샘플한 크롭이 다시 줄지 않는다.
  max_side_len: 2560

# ---------------------------------------------------------------------------
# ① 전처리
# ---------------------------------------------------------------------------
pipeline:
  # 긴 변 목표 길이 (A4 300dpi ~= 2480). null 이면 원본 유지. 확대는 하지 않는다.
  # 결과 좌표계의 기준이 되고, 크롭 해상도도 여기서 결정된다.
  # 원본 스캔이 2480 보다 크면 null 로 두는 편이 크롭 OCR 에 유리하다
  # (다만 VLM 입력이 커지므로 detect.tiles 를 함께 늘려라).
  target_long_side: 2480
  # 기울기 보정 (0.4~15도 구간에서만 적용)
  deskew: true

# ---------------------------------------------------------------------------
# 산출물
# ---------------------------------------------------------------------------
output:
  out_dir: out
  # 박스 표시 이미지 저장 여부
  write_image: true
  # JSON 에 VLM 원본 판단 + 크롭 OCR 박스 + 원시응답까지 포함 (디버깅. 파일이 커진다)
  # 성능을 진단할 때는 켜라 — VLM 이 무엇을 읽었는지와 OCR 이 무엇을 읽었는지를
  # 나란히 볼 수 있어야 어느 단계를 손볼지 판단할 수 있다.
  include_ocr: false
  # 오버레이 한글 폰트. null 이어도 라벨(ASCII)은 표시된다.
  font_path: null
  # 크롭 OCR 박스 전체를 회색으로 함께 표시 (디버깅)
  show_ocr_boxes: false
