# 개인정보 영역 탐지 파이프라인 설정
#
# 적용 순서 (뒤가 앞을 덮는다):
#   코드 기본값 → 이 파일 → 환경변수(PII_*) → CLI 플래그
#
# 탐색 순서: --config 인자 > $PII_CONFIG > ./config.yaml > ./config/default.yaml
# 오타난 키는 조용히 무시되지 않고 실행이 즉시 실패한다.

# ---------------------------------------------------------------------------
# LLM (vLLM OpenAI 호환 서버)
# ---------------------------------------------------------------------------
llm:
  # 모델 이름. vLLM 기동 시 지정한 것과 정확히 일치해야 한다.
  model: Qwen/Qwen3.5-9B
  base_url: http://127.0.0.1:8000/v1
  # vLLM 은 키를 검증하지 않으므로 더미 값이어도 된다.
  api_key: EMPTY

  # 0 고정 권장. 학습데이터 구축과 감사 대응에는 결정론적 출력이 필요하다.
  temperature: 0.0

  # 출력 상한. 512 는 부족하다 — 한 항목이 pass-1 약 20토큰, pass-2 는 reason
  # 까지 40~60토큰이라 512 면 pass-1 약 25건 / pass-2 약 10건에서 잘린다.
  # 잘리면 그 페이지의 LLM 탐지가 전량 날아간다 (JSON 이 불완전해짐).
  max_tokens: 2048
  # 잘렸을 때 재시도에 쓸 상한. temperature=0 이라 같은 상한으로 재시도하면
  # 매번 같은 지점에서 똑같이 잘린다. 상한을 올려야만 벗어난다.
  max_tokens_on_truncation: 4096
  timeout: 60.0

  guided_backend: xgrammar
  # Qwen3 계열 추론 모드. 켜면 사고 토큰을 수천 개 뱉어 지연시간 예산을 날린다.
  # 분류 태스크에는 이득이 없다. false 유지.
  enable_thinking: false

  # pass-2 로 보낼 이미지의 긴 변 길이.
  # 너무 줄이면 모델이 작은 글씨를 못 읽어 pass-2 의 존재 의미가 사라진다.
  # 1500 이상 유지할 것.
  image_max_side: 1800

  # 스키마 위반 / 네트워크 오류 재시도 횟수
  max_retries: 2

# ---------------------------------------------------------------------------
# OCR (PaddleOCR)
# ---------------------------------------------------------------------------
ocr:
  lang: korean

  # 폐쇄망에서는 필수. PaddleOCR 은 기본적으로 첫 실행 시 모델을 자동
  # 다운로드하는데 폐쇄망에서는 여기서 실패한다.
  #   python scripts/download_models.py --out ./ocr_models
  # 로 미리 반입하고 아래 경로를 채울 것. 환경변수로도 지정 가능:
  #   PII_OCR_DET_DIR / PII_OCR_REC_DIR / PII_OCR_CLS_DIR
  det_model_dir: null
  rec_model_dir: null
  cls_model_dir: null

  # 검출 임계값. 낮게 유지해야 손글씨·도장에 겹친 글자가 살아남는다.
  # 읽지 못한 박스도 번호를 부여해 pass-2 에서 회수하므로, 넉넉히 잡는 편이 낫다.
  det_db_thresh: 0.20
  det_db_box_thresh: 0.30
  det_db_unclip_ratio: 1.8

  # rec 신뢰도 구간: >= ok 는 OK, < floor 는 FAILED(내용 신뢰 불가), 사이는 LOW_CONF
  rec_conf_ok: 0.80
  rec_conf_floor: 0.35

  use_gpu: true
  # vLLM 과 같은 GPU 를 쓰므로 상한을 둔다 (MB).
  # vLLM 의 --gpu-memory-utilization 과 합이 100% 를 넘지 않게 맞출 것.
  gpu_mem: 4000
  # 검출 입력 최대 변 길이. 작으면 작은 글씨를 놓친다.
  max_side_len: 2560

# ---------------------------------------------------------------------------
# 파이프라인
# ---------------------------------------------------------------------------
pipeline:
  # 이미지 검수 pass. 손글씨·도장·서명이 있는 문서에서는 반드시 켤 것.
  # OCR 이 못 읽은 것은 텍스트 pass 로 회수할 수 없다.
  enable_pass2: true

  # true 면 1차 결과를 감추고 독립 판단시킨다. 앵커링 편향은 없지만
  # 중복 판단이 늘어난다. 검증셋에서 두 방식을 비교해볼 것.
  pass2_blind: false

  # 전처리: 긴 변 목표 길이 (A4 300dpi ~= 2480). null 이면 원본 유지. 확대는 하지 않는다.
  target_long_side: 2480
  # 기울기 보정 (0.4~15도 구간에서만 적용)
  deskew: true

# ---------------------------------------------------------------------------
# 값 전파
# ---------------------------------------------------------------------------
# 한 곳에서 개인정보로 확정된 값과 같은(또는 OCR 오독 수준으로 비슷한) 텍스트를
# 가진 나머지 OCR 박스를 일괄 회수한다.
#
# 같은 이름·번호가 문서 여러 곳에 나오는데 일부만 탐지되는 것은 정상적으로
# 발생한다 — 규칙 레이어는 박스 하나씩만 보고, pass-1 은 필드 라벨 근처를 잘
# 잡고, pass-2 는 max_tokens 안에서 상위 몇 개만 보고하기 때문이다.
propagate:
  enabled: true

  # 비교는 회피 표기를 접은 형태로 한다 (normalize.py). 한글 수사·호모글리프·
  # 전각·비가시문자는 여기서 흡수되므로 별도 설정이 없다.
  #
  # 유사도 매칭 임계값. 1.0 이면 유사도 매칭을 끈다.
  # 정규화로 접을 수 없는 것(한글 오독 등)을 받는 경로다.
  # 주의: 0.9 이상은 사실상 완전일치다 — 11자 값에서 한 글자만 틀려도
  # SequenceMatcher 비율이 0.909 로 떨어진다. 번호류의 회피 표기는 유사도가
  # 아니라 normalize.py 의 정규화가 담당한다.
  min_similarity: 0.85

  # 씨앗 개수 상한 (연산량 제한). 잘리면 warning 을 남긴다.
  max_seeds: 64

  # 전파할 라벨. null 이면 SIGNATURE 를 뺀 전체 (텍스트가 없어 전파 불가).
  # ORG/TITLE 도 기본 포함이다 — 마스킹을 넓게 잡는 방침이므로 기관명·직위도
  # 등장하는 모든 위치를 덮는다. 서식 전체에 깔린 은행명이 전부 잡히는 것은
  # 의도한 동작이다. 과검이 문제가 되면 여기서 좁혀라. 예:
  #   propagate_labels: [NAME, RRN, PHONE, ADDRESS, ACCOUNT_NO, CARD_NO, EMAIL]
  propagate_labels: null

# ---------------------------------------------------------------------------
# 산출물
# ---------------------------------------------------------------------------
output:
  out_dir: out
  # 박스 표시 이미지 저장 여부
  write_image: true
  # JSON 에 OCR 박스 + LLM 원시응답까지 포함 (디버깅용. 파일이 커진다)
  include_ocr: false
  # 오버레이 한글 폰트. null 이어도 라벨(ASCII)은 표시된다.
  font_path: null
  # OCR 박스 전체를 회색으로 함께 표시 (디버깅)
  show_ocr_boxes: false
